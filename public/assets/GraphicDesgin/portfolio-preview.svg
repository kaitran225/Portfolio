<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="portfolioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#6933FF;stop-opacity:1" />
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge> 
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="630" fill="url(#portfolioGrad)" />
    
    <!-- Decorative circles -->
    <circle cx="100" cy="100" r="60" fill="rgba(255,255,255,0.1)" />
    <circle cx="1100" cy="530" r="80" fill="rgba(255,255,255,0.08)" />
    <circle cx="1000" cy="150" r="40" fill="rgba(255,255,255,0.12)" />
    <circle cx="200" cy="500" r="50" fill="rgba(255,255,255,0.09)" />
    
    <!-- Main content area -->
    <rect x="100" y="150" width="1000" height="330" fill="rgba(255,255,255,0.1)" rx="20" />
    
    <!-- Profile area -->
    <circle cx="250" cy="315" r="80" fill="rgba(255,255,255,0.2)" />
    <circle cx="250" cy="315" r="70" fill="rgba(255,255,255,0.1)" />
    <text x="250" y="325" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="40" font-weight="bold">KT</text>
    
    <!-- Main text -->
    <text x="400" y="250" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold" filter="url(#glow)">Trần Nguyên Khánh</text>
    <text x="400" y="290" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="28">Full-Stack Developer</text>
    <text x="400" y="330" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="20">React 19 • TypeScript • Node.js • AI Integration</text>
    <text x="400" y="370" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="18">Available for OJT Fall 2025</text>
    
    <!-- Tech icons representation -->
    <rect x="400" y="400" width="40" height="40" fill="rgba(97, 218, 251, 0.8)" rx="8" />
    <text x="420" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TS</text>
    
    <rect x="460" y="400" width="40" height="40" fill="rgba(97, 219, 251, 0.8)" rx="8" />
    <text x="480" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">React</text>
    
    <rect x="520" y="400" width="40" height="40" fill="rgba(104, 191, 65, 0.8)" rx="8" />
    <text x="540" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Node</text>
    
    <rect x="580" y="400" width="40" height="40" fill="rgba(247, 98, 49, 0.8)" rx="8" />
    <text x="600" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AI</text>
    
    <!-- Portfolio link -->
    <text x="600" y="80" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="16">kaitran.dev</text>
    
    <!-- GitHub corner -->
    <text x="1050" y="80" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="14">github.com/kaitran225</text>
  </svg>