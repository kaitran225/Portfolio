services:
  - type: web
    name: portfolio
    env: docker
    repo: https://github.com/kaitran225/Portfolio.git
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    plan: free
    # Optimized for free tier
    scaling:
      minInstances: 1
      maxInstances: 1
    # Auto-deploy on push to main branch
    autoDeploy: true
